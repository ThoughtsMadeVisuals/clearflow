<div class="sw" id="sw" hidden><div class="scrim" onclick="closeSheet()"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details" tabindex="-1"><div class="grab" id="grab"><i></i></div><div id="shb"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const SC=["Streaming","Software","Music","Gaming","Utilities","Insurance","Fitness","Rent","Other"];
const EC=["Food","Coffee","Groceries","Transport","Bills","Shopping","Health","Fun","Other"];
const CC=["Travel","Meals","Supplies","Software","Equipment","Marketing","Other"];
const IC={Food:"🍜",Coffee:"☕",Groceries:"🛒",Transport:"🚗",Bills:"🧾",Shopping:"🛍️",Health:"💊",Fun:"🎉",Other:"🏷️",Streaming:"📺",Software:"💻",Music:"🎵",Gaming:"🎮",Utilities:"💡",Insurance:"🛡️",Fitness:"🏋️",Rent:"🏠",Travel:"✈️",Meals:"🍽️",Supplies:"📦",Equipment:"🔧",Marketing:"📣"};
const ic=c=>IC[c]||"🏷️";
const F={monthly:1,weekly:52/12,yearly:1/12};
let S={cur:"RM",budget:0,subs:[],exp:[],co:[],cards:[],wallets:[],paid:{},lastPay:"",pools:[]};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.toLocaleDateString("en-CA");
const uid=()=>Math.random().toString(36).slice(2,9);
let month=iso(new Date()).slice(0,7);
const money=n=>S.cur+" "+(+n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const mo=s=>s.amt*F[s.cycle];
const fd=d=>d.toLocaleDateString(undefined,{day:"numeric",month:"short"});
const fds=s=>fd(new Date(s+"T00:00"));
const sum=a=>a.reduce((t,x)=>t+x.amt,0);
const pl=(n,w,p)=>n+" "+(n===1?w:(p||w+"s"));
let stMsg="";
function st(t){stMsg=t;const e=$("#st");if(e)e.textContent=t}
function buzz(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
function nextDue(s){const t=new Date();t.setHours(0,0,0,0);let d=new Date(s.next+"T00:00"),g=0;
 while(d<t&&g++<600){if(s.cycle==="weekly")d.setDate(d.getDate()+7);else if(s.cycle==="yearly")d.setFullYear(d.getFullYear()+1);else d.setMonth(d.getMonth()+1)}
 return d}
function days(d){const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)}
function when(d){const n=days(d);return n===0?"today":n===1?"tomorrow":n===-1?"yesterday":n<0?(-n)+" days ago":"in "+n+" days"}
function save(){try{localStorage.setItem("trk",JSON.stringify(S));st("Saved on this device")}catch(e){st("Couldn't save. Check your browser storage settings.")}}
function shift(n){const[y,m]=month.split("-").map(Number);month=iso(new Date(y,m-1+n,1)).slice(0,7);render()}
const hasCard=id=>!!id&&(S.cards.some(c=>c.id===id)||S.wallets.some(w=>w.id===id));
const cardName=id=>id?((S.cards.find(c=>c.id===id)||S.wallets.find(w=>w.id===id)||{}).name||""):"";
const meta=(...a)=>esc(a.filter(Boolean).join(" · "));
// ---------- Credit cards
const dOf=(y,m,d)=>new Date(y,m,Math.min(d,new Date(y,m+1,0).getDate()));
function cyc(c){const t=new Date();t.setHours(0,0,0,0);let L=dOf(t.getFullYear(),t.getMonth(),c.sd);if(L>t)L=dOf(t.getFullYear(),t.getMonth()-1,c.sd);
 const P=dOf(L.getFullYear(),L.getMonth()-1,c.sd),N=dOf(L.getFullYear(),L.getMonth()+1,c.sd);
 let D=dOf(L.getFullYear(),L.getMonth(),c.dd);if(D<=L)D=dOf(L.getFullYear(),L.getMonth()+1,c.dd);return{P,L,N,D}}
function stepD(d,cy,n){d=new Date(d);if(cy==="weekly")d.setDate(d.getDate()+7*n);else if(cy==="yearly")d.setFullYear(d.getFullYear()+n);else d.setMonth(d.getMonth()+n);return d}
function charges(id,from,to){const f=iso(from),t=iso(to),today=iso(new Date()),out=[];
 S.exp.forEach(e=>{if(e.pay===id&&e.date>f&&e.date<=t)out.push({date:e.date,amt:e.amt,note:e.note||e.cat,src:e.cat})});
 S.co.forEach(e=>{if(e.pay===id&&e.date>f&&e.date<=t)out.push({date:e.date,amt:e.amt,note:e.note||e.cat,src:"Company"})});
 S.subs.forEach(s=>{if(s.pay!==id||s.on===false)return;let d=nextDue(s),g=0;while(iso(d)>f&&g++<400)d=stepD(d,s.cycle,-1);
  g=0;d=stepD(d,s.cycle,1);while(iso(d)<=t&&g++<400){const ds=iso(d);if(ds>f&&ds>=s.next)out.push({date:ds,amt:s.amt,note:s.name,src:ds>today?"Bill, upcoming":"Bill",up:ds>today});d=stepD(d,s.cycle,1)}});
 return out.sort((a,b)=>b.date.localeCompare(a.date))}
function cardInfo(c){const{P,L,N,D}=cyc(c),last=charges(c.id,P,L),now=charges(c.id,L,N),key=c.id+"|"+iso(L),lt=sum(last),paid=!!S.paid[key];
 return{L,N,D,now,key,lt,paid,nt:sum(now.filter(x=>!x.up)),ut:sum(now.filter(x=>x.up)),due:lt>0&&!paid?lt:0}}
const WQ=["Touch 'n Go","GrabPay","Boost","ShopeePay","MAE"];
// ---------- Water game: savings pools, levels, streaks, badges
const okDate=d=>/^\d{4}-\d\d-\d\d$/.test(d||"");
const savedIn=mk=>S.pools.reduce((a,p)=>a+p.dep.filter(d=>d.date.startsWith(mk)).reduce((b,d)=>b+d.amt,0),0);
const LV=[[0,"Puddle"],[100,"Pond"],[300,"Stream"],[700,"River"],[1500,"Lake"],[3000,"Sea"],[6000,"Ocean"]];
let lastLv=null;
function game(){const tdy=new Date();tdy.setHours(0,0,0,0);const tk=iso(tdy);
 const commit=S.subs.filter(s=>s.on!==false).reduce((a,s)=>a+mo(s),0),perDay={};
 S.exp.forEach(e=>perDay[e.date]=(perDay[e.date]||0)+e.amt);
 const start=[...S.exp.map(e=>e.date),...S.co.map(e=>e.date),...S.pools.flatMap(p=>p.dep.map(d=>d.date))].filter(d=>okDate(d)&&d<=tk).sort()[0];
 const allow=d=>Math.max(0,S.budget-commit)/new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
 let onPace=0,run=0,best=0,noSpend=false;
 if(start){let d=new Date(start+"T00:00");const min=new Date(tdy);min.setDate(min.getDate()-120);if(d<min)d=min;
  while(d<tdy){const v=perDay[iso(d)]||0;if(!v)noSpend=true;
   if(S.budget>0&&v<=allow(d)+.005){onPace++;run++;best=Math.max(best,run)}else run=0;d.setDate(d.getDate()+1)}}
 const A=S.budget>0?allow(tdy):0,todayOk=S.budget>0&&(perDay[tk]||0)<=A+.005,streak=S.budget>0?run+(todayOk?1:0):0;best=Math.max(best,streak);
 let poolPts=0,full=0,deps=0;S.pools.forEach(p=>{const t=sum(p.dep);deps+=p.dep.length;if(p.target>0){poolPts+=Math.min(100,Math.floor(t/p.target*100));if(t>=p.target-.005)full++}});
 let goodMonths=0;if(S.budget>0){const cm=tk.slice(0,7);new Set(S.exp.map(e=>e.date.slice(0,7))).forEach(mk=>{if(mk<cm&&sum(S.exp.filter(e=>e.date.startsWith(mk)))+commit+savedIn(mk)<=S.budget+.005)goodMonths++})}
 const entries=S.exp.length+S.co.length+S.subs.length,drops=entries*2+onPace*10+deps*5+poolPts+full*50+goodMonths*100;
 let lv=0;LV.forEach((x,i)=>{if(drops>=x[0])lv=i});
 const badges=[["First drop","Log your first entry",entries>0],["No-spend day","A full day with no daily spending",noSpend],["Steady stream","Stay on pace 7 days in a row",best>=7],["Unbroken river","Stay on pace 30 days in a row",best>=30],["First pour","Pour money into a savings pool",deps>0],["Full pool","Fill a savings pool to its goal",full>0],["Leak fixer","Pause a bill",S.subs.some(s=>s.on===false)],["Calm waters","Finish a month under budget",goodMonths>0],["Card keeper","Mark a card statement as paid",Object.keys(S.paid||{}).length>0]].map(([n,d,on])=>({n,d,on}));
 return{drops,lv,name:LV[lv][1],prevAt:LV[lv][0],nextAt:LV[lv+1]?LV[lv+1][0]:0,nextName:LV[lv+1]?LV[lv+1][1]:"",streak,best,A,todayOk,badges}}
// ---------- Toasts (with optional Undo)
let toastT;
function fx(msg,kind,action){const t=$("#toast");t.innerHTML="";const s=document.createElement("span");s.textContent=msg;t.appendChild(s);
 if(action){const b=document.createElement("button");b.textContent=action.label;b.onclick=()=>{t.className="toast";clearTimeout(toastT);action.fn()};t.appendChild(b)}
 t.className="toast on "+(kind||"");clearTimeout(toastT);toastT=setTimeout(()=>t.className="toast",action?5000:2600);if(kind==="drain"||kind==="fill")splash=1;kick()}
function withUndo(msg,fn,keepSheet){const snap=JSON.stringify(S);fn();save();if(!keepSheet)closeSheet();render();
 fx(msg,"",{label:"Undo",fn:()=>{merge(JSON.parse(snap));save();render();if(typeof keepSheet==="function")keepSheet();fx("Restored")}})}
// ---------- Bottom sheet
let sheetOpen=false,lastFocus=null;
function sheet(html,focusSel){const w=$("#sw"),b=$("#shb");b.innerHTML=html;
 if(!sheetOpen){lastFocus=document.activeElement;w.hidden=false;document.body.classList.add("lock");void w.offsetWidth;w.classList.add("on");sheetOpen=true;$("#sheet").scrollTop=0}
 const f=focusSel&&b.querySelector(focusSel);try{(f||$("#sheet")).focus({preventScroll:true})}catch(e){}}
function closeSheet(){if(!sheetOpen)return;sheetOpen=false;const w=$("#sw");w.classList.remove("on");document.body.classList.remove("lock");
 setTimeout(()=>{if(!sheetOpen){w.hidden=true;$("#shb").innerHTML=""}},320);
 if(lastFocus&&document.body.contains(lastFocus))try{lastFocus.focus({preventScroll:true})}catch(e){}}
addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
(function(){const g=$("#grab"),sh=$("#sheet");let y0=null,dy=0;
 g.addEventListener("pointerdown",e=>{y0=e.clientY;dy=0;sh.style.transition="none";try{g.setPointerCapture(e.pointerId)}catch(x){}});
 g.addEventListener("pointermove",e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=`translateY(${dy}px)`});
 const end=()=>{if(y0==null)return;y0=null;sh.style.transition="";sh.style.transform="";if(dy>80)closeSheet()};
 g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end)})();
// ---------- Add / edit sheet for expenses, bills and company expenses
const chips=(name,list,val,lab)=>`<div class="chips" role="radiogroup" aria-label="${lab}">`+list.map(([v,t])=>`<label class="chip"><input type="radio" name="${name}" value="${esc(v)}"${v===val?" checked":""}><span>${t}</span></label>`).join("")+`</div>`;
function payChips(v){const all=[["","💵 Cash"],...S.cards.map(c=>[c.id,"💳 "+esc(c.name)]),...S.wallets.map(w=>[w.id,"📱 "+esc(w.name)])];
 if(all.length<2)return "";return `<div class="fld"><span class="lab">Paid with</span>${chips("pay",all,hasCard(v)?v:"","Paid with")}</div>`}
function openAdd(kind,id){kind=kind||"exp";const arr=kind==="exp"?S.exp:kind==="co"?S.co:S.subs,rec=id?arr.find(x=>x.id===id):null;if(id&&!rec)return;
 const prev=!id&&sheetOpen&&$("#f-amt")?$("#f-amt").value:"",v=rec||{};
 const cats=kind==="exp"?EC:kind==="co"?CC:SC,cat=v.cat||(kind==="sub"?"Streaming":cats[0]),cl=cats.includes(cat)?cats:[...cats,cat];
 const seg=`<div class="seg" role="tablist" aria-label="Type">${[["exp","Expense"],["sub","Bill"],["co","Company"]].map(([k,t])=>`<button type="button" role="tab" aria-selected="${k===kind}" class="${k===kind?"on":""}" onclick="openAdd('${k}')">${t}</button>`).join("")}</div>`;
 const dateV=kind==="sub"?(rec?iso(nextDue(v)):iso(new Date())):(v.date||iso(new Date()));
 sheet(`<form id="addf" onsubmit="saveAdd(event,'${kind}','${id||""}')">
 ${id?`<h2>${{exp:"Edit expense",sub:"Edit bill",co:"Edit company expense"}[kind]}</h2>`:seg}
 ${kind==="sub"?`<input class="name" name="nm" placeholder="Bill name, e.g. Netflix or rent" aria-label="Bill name" required maxlength="60" value="${esc(v.name||"")}">`:""}
 <label class="amt"><span>${esc(S.cur)}</span><input id="f-amt" name="amt" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="0.00" aria-label="Amount" required value="${v.amt!=null?v.amt:prev}"></label>
 ${kind==="sub"?`<div class="fld"><span class="lab">Repeats</span>${chips("cycle",[["monthly","Monthly"],["weekly","Weekly"],["yearly","Yearly"]],v.cycle||"monthly","Repeats")}</div>`:""}
 <div class="fld"><span class="lab">Category</span>${chips("cat",cl.map(c=>[c,ic(c)+" "+esc(c)]),cat,"Category")}</div>
 ${payChips(rec?v.pay:S.lastPay)}
 <div class="grid2"><label class="fl">${kind==="sub"?"Next bill date":"Date"}<input name="date" type="date" required value="${dateV}"></label>
 ${kind!=="sub"?`<label class="fl">${kind==="co"?"Vendor / note":"Note"}<input name="note" placeholder="Optional" maxlength="80" value="${esc(v.note||"")}"></label>`:"<span></span>"}</div>
 <button class="btn primary big">${id?"Save changes":{exp:"Add expense",sub:"Add bill",co:"Add company expense"}[kind]}</button></form>`,kind==="sub"&&!id?"input[name=nm]":id?null:"#f-amt")}
function saveAdd(e,kind,id){e.preventDefault();const f=e.target.elements,amt=Math.round((+f.amt.value||0)*100)/100;if(!(amt>0)){f.amt.focus();return}
 const pay=f.pay?f.pay.value:"";S.lastPay=pay;let msg,k="";
 if(kind==="sub"){const o={name:f.nm.value.trim(),amt,cycle:f.cycle.value,next:f.date.value,cat:f.cat.value,pay};if(!o.name)return;
  if(id){const s=S.subs.find(s=>s.id===id);if(s)Object.assign(s,o);msg="Bill updated"}else{S.subs.push(Object.assign({id:uid(),on:true},o));msg=`New bill: ${money(mo(o))} a month`;k="drain"}}
 else{const arr=kind==="exp"?S.exp:S.co,o={amt,cat:f.cat.value,date:f.date.value,note:f.note.value.trim(),pay};
  if(id){const x=arr.find(x=>x.id===id);if(x)Object.assign(x,o);msg="Saved"}
  else{arr.push(Object.assign({id:uid()},kind==="co"?{re:false}:{},o));msg=kind==="exp"?`−${money(amt)} from your tank`:"Company expense added";k=kind==="exp"?"drain":"";if(okDate(o.date))month=o.date.slice(0,7)}}
 save();closeSheet();render();buzz();fx(msg,k)}
// ---------- Item detail sheets
const detail=(icon,title,amt,rows)=>`<div class="det"><span class="ic">${icon}</span><div class="dt">${esc(title)}</div><div class="big md">${amt}</div></div>`+(rows.filter(r=>r[1]).length?`<div class="kv">${rows.filter(r=>r[1]).map(([k,v])=>`<div><span>${k}</span><b>${esc(v)}</b></div>`).join("")}</div>`:"");
function openExp(id){const e=S.exp.find(x=>x.id===id);if(!e)return;
 sheet(detail(ic(e.cat),e.note||e.cat,money(e.amt),[["Category",e.cat],["Date",new Date(e.date+"T00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"})],["Paid with",cardName(e.pay)||"Cash"]])
 +`<div class="acts"><button class="btn" onclick="openAdd('exp','${id}')">Edit</button><button class="btn danger" onclick="delExp('${id}')">Delete</button></div>`)}
function delExp(id){withUndo("Expense deleted",()=>{S.exp=S.exp.filter(x=>x.id!==id)})}
function openSub(id){const s=S.subs.find(x=>x.id===id);if(!s)return;const d=nextDue(s),off=s.on===false;
 sheet(detail(ic(s.cat),s.name,money(s.amt),[["Repeats",s.cycle[0].toUpperCase()+s.cycle.slice(1)],["Per month",s.cycle!=="monthly"?money(mo(s)):""],["Next bill",off?"Paused":fd(d)+", "+when(d)],["Category",s.cat],["Paid with",cardName(s.pay)||"Cash"]])
 +`<div class="acts"><button class="btn" onclick="openAdd('sub','${id}')">Edit</button><button class="btn" onclick="togSub('${id}')">${off?"Resume":"Pause"}</button><button class="btn danger" onclick="delSub('${id}')">Delete</button></div>`)}
function togSub(id){const s=S.subs.find(s=>s.id===id);if(!s)return;s.on=s.on===false;save();closeSheet();render();fx(s.on?`${s.name} resumed`:`${s.name} paused`)}
function delSub(id){withUndo("Bill deleted",()=>{S.subs=S.subs.filter(s=>s.id!==id)})}
function openCo(id){const e=S.co.find(x=>x.id===id);if(!e)return;
 sheet(detail(ic(e.cat),e.note||e.cat,money(e.amt),[["Category",e.cat],["Date",fds(e.date)],["Paid with",cardName(e.pay)||"Cash"],["Status",e.re?"Reimbursed":"Not claimed yet"]])
 +`<button class="btn ${e.re?"":"primary"} big" style="margin-top:16px" onclick="togCo('${id}')">${e.re?"Mark as not reimbursed":"Mark as reimbursed"}</button>
 <div class="acts" style="margin-top:8px"><button class="btn" onclick="openAdd('co','${id}')">Edit</button><button class="btn danger" onclick="delCo('${id}')">Delete</button></div>`)}
function togCo(id){const x=S.co.find(x=>x.id===id);if(!x)return;x.re=!x.re;save();closeSheet();render();buzz();fx(x.re?"Marked as reimbursed ✓":"Marked as not reimbursed")}
function delCo(id){withUndo("Company expense deleted",()=>{S.co=S.co.filter(x=>x.id!==id)})}
function openBudget(){sheet(`<form onsubmit="event.preventDefault();setBudget(this.amt.value);closeSheet();fx('Budget saved')"><h2>Monthly budget</h2><p class="m" style="margin:0">Everything you spend, every bill and every pour into savings comes out of this.</p>
 <label class="amt"><span>${esc(S.cur)}</span><input id="f-amt" name="amt" type="number" inputmode="decimal" min="0" step="1" placeholder="0" aria-label="Monthly budget" value="${S.budget||""}"></label>
 <button class="btn primary big">Save budget</button></form>`,"#f-amt")}
function setBudget(v){S.budget=Math.max(0,+v||0);save();render()}
// ---------- Cards and wallets
function openCardForm(id){const c=id?S.cards.find(c=>c.id===id):{};if(!c)return;
 sheet(`<form onsubmit="saveCard(event,'${id||""}')"><h2>${id?"Edit card":"Add a credit card"}</h2>
 <input class="name" name="nm" placeholder="Card name, e.g. Maybank Visa" aria-label="Card name" required maxlength="40" value="${esc(c.name||"")}" style="margin:10px 0 14px">
 <div class="grid2"><label class="fl">Statement day<input name="sd" type="number" inputmode="numeric" min="1" max="31" required placeholder="e.g. 5" value="${c.sd||""}"></label>
 <label class="fl">Payment due day<input name="dd" type="number" inputmode="numeric" min="1" max="31" required placeholder="e.g. 25" value="${c.dd||""}"></label></div>
 <label class="fl" style="margin-bottom:16px">Credit limit (optional)<input name="lim" type="number" inputmode="numeric" min="0" step="1" placeholder="e.g. 10000" value="${c.lim||""}"></label>
 <button class="btn primary big">${id?"Save card":"Add card"}</button></form>`,id?null:"input[name=nm]")}
function saveCard(e,id){e.preventDefault();const f=e.target.elements,cl=v=>Math.min(31,Math.max(1,Math.round(+v)||1));
 const o={name:f.nm.value.trim(),sd:cl(f.sd.value),dd:cl(f.dd.value),lim:+f.lim.value||0};if(!o.name)return;
 if(id){const c=S.cards.find(c=>c.id===id);if(c)Object.assign(c,o)}else S.cards.push(Object.assign({id:uid()},o));
 save();closeSheet();render();fx(id?"Card saved":"Card added")}
function delCard(id){withUndo("Card deleted",()=>{S.cards=S.cards.filter(c=>c.id!==id);[S.exp,S.co,S.subs].forEach(a=>a.forEach(x=>{if(x.pay===id)x.pay=""}));if(S.lastPay===id)S.lastPay=""})}
function togPaid(k,cid){if(S.paid[k])delete S.paid[k];else S.paid[k]=true;save();render();openCard(cid);buzz();if(S.paid[k])fx("Statement marked as paid ✓","fill")}
function openCard(id){const c=S.cards.find(c=>c.id===id);if(!c)return;const k=cardInfo(c),bal=k.nt+(k.paid?0:k.lt),late=k.due&&days(k.D)<0;

 $("#v-cards").innerHTML=(c.ci.length?c.ci.map(({c:cd,k},i)=>{const bal=k.nt+(k.paid?0:k.lt),late=k.due&&days(k.D)<0;
  return `<button class="cc c${i%4}" onclick="openCard('${cd.id}')"><span class="n"><span>${esc(cd.name)}</span><span>›</span></span><span><span class="s">${k.due?(late?"Overdue":"Due "+when(k.D)):"Owed this cycle"}</span><div class="v">${money(k.due||bal)}</div>${cd.lim>0?`<span class="bar"><i style="width:${Math.min(100,bal/cd.lim*100)}%"></i></span>`:""}</span></button>`}).join("")
  :`<div class="card empty">Add a credit card to see what you owe and when it's due.</div>`)
 +`<button class="btn ghost big" onclick="openCardForm()">+ Add a credit card</button>
 <div class="stitle">E-wallets</div><div class="card list">${S.wallets.length?S.wallets.map(w=>item({on:`openWallet('${w.id}')`,ic:"📱",t:esc(w.name),a:money(sum(ex.filter(e=>e.pay===w.id))),a2:"this month"})).join(""):'<div class="empty">No e-wallets yet.</div>'}
 <div style="padding:8px 16px 14px">${free.length?`<div class="chips" style="margin-bottom:10px">${free.map(n=>`<button type="button" class="qchip" data-n="${esc(n)}" onclick="addWallet(this.dataset.n)">+ ${esc(n)}</button>`).join("")}</div>`:""}
 <form style="display:flex;gap:8px" onsubmit="event.preventDefault();addWallet(this.nm.value);this.nm.value=''"><input name="nm" placeholder="Other e-wallet" aria-label="E-wallet name" maxlength="40"><button class="btn primary">Add</button></form></div></div>
 <details class="more" style="padding:0 4px"><summary>How this works</summary><p class="m" style="margin:0 0 12px">Choose a card or e-wallet under "Paid with" when you log something. It already counts in your monthly totals, so don't log the card payment itself as an expense. Cards also show your statement and due date.</p></details>`}
function renderCompany(c){const by={};c.cx.forEach(e=>(by[e.date]=by[e.date]||[]).push(e));const ds=Object.keys(by).sort().reverse();
 $("#v-company").innerHTML=`<div class="card"><div class="eyebrow">To claim · ${c.mname}</div><div class="big md">${money(c.coun)}</div><div class="sub">${money(c.cot)} spent in total · not counted in your budget</div></div>
 <div class="card list">${ds.length?ds.map(d=>`<div class="dh"><span>${fds(d)}</span><span>${money(sum(by[d]))}</span></div>`+by[d].map(e=>item({on:`openCo('${e.id}')`,cls:e.re?"off":"",ic:ic(e.cat),t:esc(e.note||e.cat),s:e.re?'<span class="pill ok">Reimbursed</span>':meta(e.note?e.cat:"",cardName(e.pay))||"Not claimed",a:money(e.amt)})).join("")).join(""):`<div class="empty">No company expenses in ${c.mname}.</div>`}</div>
 <button class="btn ghost big" onclick="openAdd('co')">+ Add company expense</button>`}
function renderProgress(c){const g=c.g,nx=g.nextAt?g.nextAt-g.drops:0,lp=g.nextAt?(g.drops-g.prevAt)/(g.nextAt-g.prevAt)*100:100;
 $("#v-progress").innerHTML=`<div class="card"><div class="eyebrow">Level ${g.lv+1} · ${g.drops.toLocaleString()} drops</div><div class="big md">${g.name}</div><span class="bar"><i style="width:${Math.max(2,lp)}%"></i></span><div class="m" style="margin-top:6px">${g.nextAt?`${nx.toLocaleString()} drops to ${g.nextName}`:"Top level reached"}</div></div>
 <div class="card"><div class="eyebrow">Flow streak ${g.todayOk?'<span class="pill ok">On pace today</span>':S.budget?'<span class="pill warn">Over pace today</span>':""}</div><div class="big md">${pl(g.streak,"day")}</div><div class="m">${S.budget?`Days you spent under ${money(g.A)}. Best: ${pl(g.best,"day")}.`:"Set a budget to start a streak."}</div></div>
 <div class="stitle">Badges · ${g.badges.filter(b=>b.on).length} of ${g.badges.length}</div>
 <div class="badges">${g.badges.map(b=>`<div class="bdg${b.on?" on":""}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5C8.5 7.2 5.5 10.6 5.5 14.2a6.5 6.5 0 0 0 13 0c0-3.6-3-7-6.5-11.7Z"/></svg><span><b>${esc(b.n)}</b><small>${esc(b.d)}</small></span></div>`).join("")}</div>
 <details class="more" style="padding:0 4px"><summary>How to earn drops</summary><p class="m" style="margin:0">2 per entry logged, 10 per day on pace, 5 per pour into savings plus up to 100 per pool as it fills, 50 per full pool, 100 per month finished under budget.</p></details>`}
function setTheme(t){try{if(t==="auto")localStorage.removeItem("trk-theme");else localStorage.setItem("trk-theme",t)}catch(e){}
 if(t==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;renderSettings();kick()}
function renderSettings(){const th=document.documentElement.dataset.theme||"auto";
 $("#v-settings").innerHTML=`<div class="card list">
 <label class="set"><span>Monthly budget</span><input type="number" inputmode="decimal" min="0" step="1" placeholder="Not set" value="${S.budget||""}" onchange="setBudget(this.value)"></label>
 <label class="set"><span>Currency</span><input maxlength="4" value="${esc(S.cur)}" onchange="S.cur=this.value.trim()||'RM';save();render()"></label>
 <div class="set"><span>Theme</span><div class="seg">${[["auto","Auto"],["light","Light"],["dark","Dark"]].map(([k,t])=>`<button type="button" class="${th===k?"on":""}" onclick="setTheme('${k}')">${t}</button>`).join("")}</div></div></div>
 <div class="stitle">Backup</div><div class="card"><p class="m" style="margin:0 0 12px">Your data is stored only on this device. Download a backup now and then, and use it to move to another phone.</p>
 <div class="row-btns" style="margin:0"><button class="btn primary" onclick="backup()">Download backup</button><label class="btn">Restore<input type="file" accept=".json,application/json" onchange="restore(this)"></label></div></div>
 <details class="card more" style="padding:4px 16px"><summary>Spreadsheet sync (CSV)</summary><p class="m" style="margin:0 0 12px">Export CSVs that match the Google Sheet tabs, or import rows from them. Imports add new rows and skip duplicates.</p>
 <div class="row-btns" style="margin:0 0 12px"><button class="btn" onclick="exp('subs')">Export bills</button><button class="btn" onclick="exp('exp')">Export spending</button><button class="btn" onclick="expCo()">Export company</button><label class="btn">Import CSV<input type="file" accept=".csv,.tsv,.txt" multiple onchange="imp(this.files);this.value=''"></label></div></details>
 <p class="m" style="text-align:center" id="st">${esc(stMsg)}</p>`}
function render(){const c=ctx();
 $("#ml").textContent=new Date(c.y,c.m-1,1).toLocaleDateString(undefined,{month:"short",year:"numeric"});
 setTank(c.fr,c.over?"dry":c.low?"low":"ok");
 renderHome(c);renderSpend(c);renderBills(c);renderMore(c);renderSave(c);renderCards(c);renderCompany(c);renderProgress(c);
 if(!$("#v-settings").contains(document.activeElement))renderSettings();
 if(lastLv!=null&&c.g.lv>lastLv){const nm=c.g.name;setTimeout(()=>fx(`Level up! You're now a ${nm} 💧`),2700)}lastLv=c.g.lv;kick()}
// ---------- CSV + backup
function dl(name,data,type){const b=new Blob(["﻿"+data],{type:type||"text/csv"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);st("Downloaded "+name)}
const csvEsc=v=>{v=String(v==null?"":v);return /[",\n\t]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function exp(k){const cap=s=>s[0].toUpperCase()+s.slice(1);
 const rows=k==="subs"?[["Name","Amount","Cycle","Next bill date","Category","Active","Monthly equivalent","Next due","Paid with"]].concat(S.subs.map(s=>[s.name,s.amt,cap(s.cycle),s.next,s.cat,s.on===false?"No":"Yes","","",cardName(s.pay)])):[["Date","Category","Amount","Note","Paid with"]].concat(S.exp.map(e=>[e.date,e.cat,e.amt,e.note,cardName(e.pay)]));
 dl(k==="subs"?"subscriptions.csv":"spending.csv",rows.map(r=>r.map(csvEsc).join(",")).join("\n"))}
function expCo(){const rows=[["Date","Category","Amount","Note","Reimbursed","Paid with"]].concat(S.co.map(e=>[e.date,e.cat,e.amt,e.note,e.re?"Yes":"No",cardName(e.pay)]));
 dl("company-expenses.csv",rows.map(r=>r.map(csvEsc).join(",")).join("\n"))}
function parse(t){const d=(t.split(/\r?\n/)[0]||"").indexOf("\t")>-1?"\t":",";const out=[];let r=[],c="",q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===d){r.push(c);c=""}
  else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);c="";out.push(r);r=[]}else c+=ch}
 if(c||r.length){r.push(c);out.push(r)}return out.filter(r=>r.some(x=>x.trim()))}
const payId=n=>{n=String(n||"").trim().toLowerCase();const c=n&&(S.cards.find(c=>c.name.toLowerCase()===n)||S.wallets.find(c=>c.name.toLowerCase()===n));return c?c.id:""};
function imp(files){[...files].forEach(f=>{const rd=new FileReader();rd.onload=()=>{
 const rows=parse(String(rd.result).replace(/^﻿/,"")),h=(rows.shift()||[]).map(x=>x.trim().toLowerCase());let n=0;
 if(h[0]==="name"){const k=new Set(S.subs.map(s=>[s.name,s.amt,s.cycle,s.next].join("|")));
  rows.forEach(r=>{const o={id:uid(),name:(r[0]||"").trim(),amt:+r[1],cycle:(r[2]||"monthly").trim().toLowerCase(),next:(r[3]||"").trim(),cat:(r[4]||"Other").trim(),on:(r[5]||"Yes").trim().toLowerCase()!=="no",pay:payId(r[8])};
   if(!o.name||!(o.amt>=0)||!F[o.cycle]||!okDate(o.next))return;
   const key=[o.name,o.amt,o.cycle,o.next].join("|");if(k.has(key))return;k.add(key);S.subs.push(o);n++})}
 else if(h[0]==="date"&&h[4]==="reimbursed"){const k=new Set(S.co.map(e=>[e.date,e.cat,e.amt,e.note].join("|")));
  rows.forEach(r=>{const o={id:uid(),date:(r[0]||"").trim(),cat:(r[1]||"Other").trim(),amt:+r[2],note:(r[3]||"").trim(),re:(r[4]||"").trim().toLowerCase()==="yes",pay:payId(r[5])};
   if(!okDate(o.date)||!(o.amt>=0)||r[2]==="")return;
   const key=[o.date,o.cat,o.amt,o.note].join("|");if(k.has(key))return;k.add(key);S.co.push(o);n++})}
 else if(h[0]==="date"){const k=new Set(S.exp.map(e=>[e.date,e.cat,e.amt,e.note].join("|")));
  rows.forEach(r=>{const o={id:uid(),date:(r[0]||"").trim(),cat:(r[1]||"Other").trim(),amt:+r[2],note:(r[3]||"").trim(),pay:payId(r[4])};
   if(!okDate(o.date)||!(o.amt>=0)||r[2]==="")return;
   const key=[o.date,o.cat,o.amt,o.note].join("|");if(k.has(key))return;k.add(key);S.exp.push(o);n++})}
 else{st("Not recognised: "+f.name);return}
 save();render();st("Imported "+n+" rows from "+f.name);fx("Imported "+pl(n,"row"))};rd.readAsText(f)})}
function backup(){dl("money-tracker-backup-"+iso(new Date())+".json",JSON.stringify(S,null,1),"application/json")}
function restore(inp){const f=inp.files[0];inp.value="";if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{const o=JSON.parse(String(rd.result).replace(/^﻿/,""));if(!o||!Array.isArray(o.subs)||!Array.isArray(o.exp))throw 0;
  if(!confirm("Replace everything in this app with the backup from "+f.name+"? Anything not in the backup will be lost."))return;
  merge(o);save();render();st("Restored from "+f.name);fx("Backup restored")}catch(e){st("That file isn't a Money Tracker backup.")}};rd.readAsText(f)}
function merge(o){S=Object.assign({cur:"RM",budget:0,subs:[],exp:[],co:[],cards:[],wallets:[],paid:{},lastPay:"",pools:[]},o);["subs","exp","co","cards","wallets","pools"].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});if(!S.paid||typeof S.paid!=="object")S.paid={};S.pools.forEach(p=>{if(!Array.isArray(p.dep))p.dep=[]})}
try{merge(JSON.parse(localStorage.getItem("trk")||"{}"))}catch(e){}
stMsg=localStorage.getItem("trk")?"Saved on this device":"Your data stays on this device";
render();go(location.hash.slice(1)||"home");
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
