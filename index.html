const cnum=(v,lo,hi,d)=>{v=typeof v==="number"||typeof v==="string"?+v:NaN;return Number.isFinite(v)?Math.min(hi,Math.max(lo,v)):d};
const camt=v=>{v=cnum(v,0,MAXAMT,NaN);return Number.isFinite(v)?Math.round(v*100)/100:NaN};
function clean(o){o=o&&typeof o==="object"&&!Array.isArray(o)?o:{};
 const list=(a,f)=>Array.isArray(a)?a.map(x=>x&&typeof x==="object"?f(x):null).filter(Boolean):[];
 const pay=v=>okId(v)?v:"",day=v=>Math.round(cnum(v,1,31,1));
 const exp=(x,co)=>{const r={id:x.id,amt:camt(x.amt),cat:ctxt(x.cat,40)||"Other",date:x.date,note:ctxt(x.note,80),pay:pay(x.pay)};if(co)r.re=x.re===true;return okId(r.id)&&okDay(r.date)&&Number.isFinite(r.amt)?r:null};
 const paid={};if(o.paid&&typeof o.paid==="object")Object.keys(o.paid).forEach(k=>{if(PAID_RE.test(k)&&o.paid[k])paid[k]=true});
 return{cur:cleanCur(o.cur),budget:cnum(o.budget,0,MAXAMT,0),
  subs:list(o.subs,s=>{const r={id:s.id,on:s.on!==false,name:ctxt(s.name,60),amt:camt(s.amt),cycle:s.cycle,next:s.next,cat:ctxt(s.cat,40)||"Other",pay:pay(s.pay)};
   return okId(r.id)&&r.name&&Number.isFinite(r.amt)&&CYC.includes(r.cycle)&&okDay(r.next)?r:null}),
  exp:list(o.exp,x=>exp(x,false)),co:list(o.co,x=>exp(x,true)),
  cards:list(o.cards,c=>{const r={id:c.id,name:ctxt(c.name,40),sd:day(c.sd),dd:day(c.dd),lim:cnum(c.lim,0,MAXAMT,0)};return okId(r.id)&&r.name?r:null}),
  wallets:list(o.wallets,w=>{const r={id:w.id,name:ctxt(w.name,40)};return okId(r.id)&&r.name?r:null}),
  paid,lastPay:pay(o.lastPay),
  pools:list(o.pools,p=>{const r={id:p.id,name:ctxt(p.name,60),target:cnum(p.target,0,MAXAMT,0),dep:list(p.dep,d=>{const q={id:d.id,date:d.date,amt:camt(d.amt)};return okId(q.id)&&okDay(q.date)&&Number.isFinite(q.amt)?q:null})};
   return okId(r.id)&&r.name?r:null})}}
function merge(o){S=clean(o)}
// ---------- PIN keypad: on-screen digits, so the system keyboard never opens.
const PIN_LEN=6;let PAD=null;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const padHTML=()=>`<div class="pin"><div class="pdots" role="status" aria-label="0 of ${PIN_LEN} digits entered">${"<i></i>".repeat(PIN_LEN)}</div><p class="pmsg" role="alert"></p>
 <div class="pkeys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join("")}<span></span><button type="button" data-k="0">0</button><button type="button" class="fn" data-k="del" aria-label="Delete last digit">⌫</button></div></div>`;
function padMount(root,onDone){root.innerHTML=padHTML();PAD={buf:"",root,onDone,busy:false};padDraw()}
function padDraw(){if(!PAD)return;const d=PAD.root.querySelector(".pdots");if(!d)return;d.querySelectorAll("i").forEach((x,i)=>x.classList.toggle("on",i<PAD.buf.length));
 d.setAttribute("aria-label",PAD.buf.length+" of "+PIN_LEN+" digits entered");PAD.root.querySelectorAll(".pkeys button").forEach(b=>b.disabled=PAD.busy)}
function padReset(msg,bad){if(!PAD)return;PAD.buf="";padDraw();const m=PAD.root.querySelector(".pmsg");if(m)m.textContent=msg||"";
 if(bad){const d=PAD.root.querySelector(".pdots");d.classList.remove("bad");void d.offsetWidth;d.classList.add("bad");setTimeout(()=>d.classList.remove("bad"),700);try{navigator.vibrate&&navigator.vibrate([30,40,30])}catch(e){}}}
async function padKey(k){if(!PAD||PAD.busy)return;const me=PAD;
 if(k==="del")me.buf=me.buf.slice(0,-1);else if(/^\d$/.test(k)&&me.buf.length<PIN_LEN){me.buf+=k;buzz()}else return;
 const m=me.root.querySelector(".pmsg");if(m&&me.buf.length===1)m.textContent="";padDraw();
 if(me.buf.length===PIN_LEN){const pin=me.buf;me.busy=true;padDraw();await sleep(140);try{await me.onDone(pin)}finally{if(PAD===me){me.busy=false;padDraw()}}}}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest(".pkeys button");if(b&&PAD&&PAD.root.contains(b))padKey(b.dataset.k)});
addEventListener("keydown",e=>{if(!PAD||!PAD.root.isConnected||PAD.root.closest("[hidden]")||e.metaKey||e.ctrlKey||e.altKey)return;const t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;
 if(/^\d$/.test(e.key)){e.preventDefault();padKey(e.key)}else if(e.key==="Backspace"){e.preventDefault();padKey("del")}});
// A PIN everyone tries first: all the same digit, or a straight run like 123456 / 654321.
const weakPin=p=>/^(\d)\1+$/.test(p)||"01234567890".includes(p)||"09876543210".includes(p);
const readEnv=()=>{try{return JSON.parse(localStorage.getItem(ENC_KEY))}catch(e){return null}};
const isPinEnv=env=>!!env&&env.pin===PIN_LEN;
// ---------- Lock screen
let lastAct=Date.now(),hiddenAt=0,lockFails=0;
function showLock(){closeSheet();$("#shb").innerHTML="";clearTimeout(toastT);const t=$("#toast");t.className="toast";t.innerHTML="";
 document.querySelectorAll(".view").forEach(v=>v.innerHTML="");$("#lockmark").innerHTML=mark();$("#locke").textContent="";$("#lockp").value="";
 const pin=isPinEnv(readEnv());$("#lockf").hidden=pin;$("#lockt").textContent=pin?"Enter your PIN":"Enter your passcode to unlock your data.";
 if(pin)padMount($("#lockpad"),onLockPin);else{$("#lockpad").innerHTML="";PAD=null}
 $("#lock").hidden=false;if(!pin)setTimeout(()=>{try{$("#lockp").focus()}catch(e){}},60)}
function lockNow(){if(!LOCK.key)return;LOCK.key=null;LOCK.salt=null;S=clean({});heroPrev=null;lastLv=null;stMsg="";showLock()}
// Shared unlock: slows down repeated guesses after 5 misses (1s, 2s, 4s … up to 60s).
async function tryUnlock(secret,wait){if(lockFails>=5){const s=Math.min(60,2**(lockFails-5));wait&&wait(s);await sleep(s*1000)}
 try{const env=readEnv(),r=await openEnv(secret,env);LOCK.key=r.key;LOCK.salt=r.salt;LOCK.iter=r.iter;LOCK.pin=isPinEnv(env)?PIN_LEN:0;merge(r.data);lockFails=0;
  PAD=null;$("#lockpad").innerHTML="";$("#lockp").value="";$("#lock").hidden=true;stMsg="Encrypted on this device";lastAct=Date.now();boot();return true}
 catch(x){lockFails++;return false}}
async function onLockPin(pin){const T=$("#lockt");T.textContent="Checking…";
 const ok=await tryUnlock(pin,s=>{T.textContent="Too many tries. Wait "+s+" s…"});if(!ok){T.textContent="Enter your PIN";padReset("Wrong PIN. Try again.",true)}}
$("#lockf").addEventListener("submit",async e=>{e.preventDefault();const b=$("#lockb"),p=$("#lockp").value;if(!p||b.disabled)return;
 b.disabled=true;b.textContent="Unlocking…";$("#locke").textContent="";
 const ok=await tryUnlock(p,s=>{b.textContent="Wait "+s+" s…"});b.disabled=false;b.textContent="Unlock";
 if(!ok){$("#locke").textContent="Wrong passcode. Try again.";try{$("#lockp").select()}catch(y){}}});
$("#lockw").onclick=()=>wipeAll();
["pointerdown","keydown","wheel","touchstart"].forEach(t=>addEventListener(t,()=>{lastAct=Date.now()},{passive:true,capture:true}));
setInterval(()=>{if(LOCK.key&&Date.now()-lastAct>IDLE_MS)lockNow()},15e3);
document.addEventListener("visibilitychange",()=>{if(document.hidden)hiddenAt=Date.now();else if(LOCK.key&&hiddenAt&&Date.now()-hiddenAt>HIDDEN_MS)lockNow()});
// ---------- Set / change / turn off the PIN, one keypad step at a time
let PF=null;
const PF_PROMPT={cur:"Enter your current PIN",new:"Choose a 6-digit PIN",again:"Enter the same PIN again"};
function openPassForm(mode){const T={set:"Set a PIN",change:"Change PIN",off:"Turn off PIN lock"}[mode];if(!T||!CRYPTO_OK)return;
 // Data locked with an older typed passcode: the app is already unlocked, so skip the "current PIN" step.
 const legacy=mode!=="set"&&!isPinEnv(readEnv());
 const steps=(mode==="set"||legacy?[]:["cur"]).concat(mode==="off"?[]:["new","again"]);
 PF={mode,steps,i:0,nw:""};
 const info=mode==="set"?`<div class="warnbox">Your data will be encrypted on this device. <b>If you forget your PIN, it can't be recovered.</b> Download a backup first.</div>`
  :mode==="off"?`<p class="m" style="margin:0 0 6px">Your data will be stored unencrypted on this device again.</p>`:"";
 if(!steps.length){sheet(`<div class="secf"><h2>${T}</h2>${info}<button class="btn danger big" style="margin-top:10px" onclick="pinOff()">Turn off</button></div>`);return}
 sheet(`<div class="secf" style="text-align:center"><h2>${T}</h2><div id="pfinfo" style="text-align:left">${info}</div><p class="m" id="pft" style="margin:0;font-size:15px;color:var(--tx);font-weight:600">${PF_PROMPT[steps[0]]}</p><div id="pfpad"></div></div>`);
 padMount($("#pfpad"),onFormPin)}
function pfStep(i,msg,bad){PF.i=i;$("#pft").textContent=PF_PROMPT[PF.steps[i]];if(i>0){const inf=$("#pfinfo");if(inf)inf.innerHTML=""}padReset(msg,bad)}
async function onFormPin(pin){if(!PF)return;const step=PF.steps[PF.i],T=$("#pft");
 if(step==="cur"){T.textContent="Checking…";try{await openEnv(pin,readEnv())}catch(x){T.textContent=PF_PROMPT.cur;padReset("Wrong PIN. Try again.",true);return}
  if(PF.mode==="off"){await pinOff();return}pfStep(PF.i+1);return}
 if(step==="new"){if(weakPin(pin)){padReset("That PIN is too easy to guess. Pick another.",true);return}PF.nw=pin;pfStep(PF.i+1);return}
 if(step==="again"){if(pin!==PF.nw){PF.nw="";pfStep(PF.steps.indexOf("new"),"Those PINs didn't match. Start again.",true);return}
  T.textContent="Encrypting…";if(!(await pinSet(pin,PF.mode))){T.textContent=PF_PROMPT.again;padReset("Something went wrong. Nothing was changed.",true)}}}
async function pinSet(pin,mode){const prev={key:LOCK.key,salt:LOCK.salt,iter:LOCK.iter,pin:LOCK.pin};
 try{const salt=crypto.getRandomValues(new Uint8Array(16)),key=await deriveKey(pin,salt,KDF_ITER);await LOCK.pending.catch(()=>{});
  saveSeq++;LOCK.key=key;LOCK.salt=salt;LOCK.iter=KDF_ITER;LOCK.pin=PIN_LEN;
  const env=await seal(key,salt,KDF_ITER,S);env.pin=PIN_LEN;localStorage.setItem(ENC_KEY,JSON.stringify(env));localStorage.removeItem("trk");
  PF=null;lastAct=Date.now();closeSheet();render();renderSettings();st("Saved and encrypted on this device");fx(mode==="set"?"PIN set. Your data is encrypted 🔒":"PIN changed");return true}
 catch(x){Object.assign(LOCK,prev);return false}}
async function pinOff(){try{await LOCK.pending.catch(()=>{});saveSeq++;LOCK.key=null;LOCK.salt=null;LOCK.pin=0;localStorage.setItem("trk",JSON.stringify(S));localStorage.removeItem(ENC_KEY);
  PF=null;closeSheet();render();renderSettings();st("Saved on this device");fx("PIN lock turned off")}catch(x){fx("Couldn't turn off the PIN lock")}}
// ---------- Delete everything Clearflow stored on this device
async function wipeAll(){if(!confirm("Delete ALL Clearflow data on this device?\n\nBills, spending, cards, savings and settings will be erased. This can't be undone, so download a backup first if you want to keep it."))return;
 saveSeq++;LOCK.key=null;
 try{["trk",ENC_KEY,"trk-theme","trk-lm","trk-hero"].forEach(k=>localStorage.removeItem(k));sessionStorage.clear()}catch(e){}
 try{if(window.caches)await Promise.all((await caches.keys()).map(k=>caches.delete(k)))}catch(e){}
 try{if(navigator.serviceWorker)await Promise.all((await navigator.serviceWorker.getRegistrations()).map(r=>r.unregister()))}catch(e){}
 location.replace(location.pathname)}
function secHTML(){const wipe=`<div class="card"><p class="m" style="margin:0 0 12px">Selling or lending this device? Erase everything Clearflow stored here.</p><button class="btn danger" onclick="wipeAll()">Delete all data on this device</button></div>`;
 if(!CRYPTO_OK)return `<div class="stitle">Security</div><div class="card"><p class="m" style="margin:0">PIN lock needs the app to be opened over HTTPS.</p></div>`+wipe;
 const on=!!LOCK.key;
 return `<div class="stitle">Security</div><div class="card"><p class="m" style="margin:0 0 12px">${on?"🔒 PIN lock on. Your data is encrypted on this device, and the app locks after 5 minutes without use.":"Add a 6-digit PIN to encrypt your data on this device and lock the app when you're away."}</p>
 <div class="row-btns" style="margin:0">${on?`<button class="btn primary" onclick="lockNow()">Lock now</button><button class="btn" onclick="openPassForm('change')">Change PIN</button><button class="btn" onclick="openPassForm('off')">Turn off</button>`:`<button class="btn primary" onclick="openPassForm('set')">Set a PIN</button>`}</div></div>`+wipe}
// ---------- Start
function boot(){themeChrome();render();go(location.hash.slice(1)||"home")}
if(!FRAMED){
 themeChrome();
 if(encOn())showLock();
 else{let raw=null;try{raw=localStorage.getItem("trk")}catch(e){}try{merge(JSON.parse(raw||"{}"))}catch(e){merge({})}
  stMsg=raw?"Saved on this device":"Your data stays on this device";boot()}
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
 if("serviceWorker" in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
